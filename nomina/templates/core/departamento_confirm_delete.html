{% extends "base.html" %}
{% block title %}Eliminar Departamento — SIRH{% endblock %}
{% block content %}
<div class="page-header"><h2>Eliminar Departamento</h2></div>
<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Esta accion no se puede deshacer.</div>
        <p>¿Esta seguro de eliminar el departamento <strong>{{ object.nombre }}</strong>?</p>
        <form method="post">{% csrf_token %}
            <div class="d-flex gap-2 mt-3"><button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button><a href="{% url 'departamento-list' %}" class="btn btn-secondary">Cancelar</a></div>
        </form>
    </div>
</div>
{% endblock %}
