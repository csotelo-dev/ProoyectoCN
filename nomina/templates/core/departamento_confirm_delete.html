{% extends "base.html" %}
{% block title %}Eliminar Departamento — SIRH{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Eliminar Departamento</h2>
    <a href="{% url 'departamento-list' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> Esta accion no se puede deshacer.</div>
        <p style="margin-bottom: 16px;">¿Confirma que desea eliminar el departamento <strong>{{ object.nombre }}</strong>?</p>
        <form method="post">{% csrf_token %}
            <div style="display: flex; gap: 8px;">
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button>
                <a href="{% url 'departamento-list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
