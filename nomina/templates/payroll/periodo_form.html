{% extends "base.html" %}
{% block title %}Nuevo Periodo — SIRH{% endblock %}
{% block content %}
<div class="page-header"><h2>Nuevo Periodo de Nomina</h2></div>
<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="post">{% csrf_token %}
            {% for field in form %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger" style="font-size: 12px; margin-top: 4px;">{{ field.errors.0 }}</div>{% endif %}</div>{% endfor %}
            <div class="d-flex gap-2 mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Crear Periodo</button><a href="{% url 'periodo-list' %}" class="btn btn-secondary">Cancelar</a></div>
        </form>
    </div>
</div>
{% endblock %}
