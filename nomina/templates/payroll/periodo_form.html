{% extends "base.html" %}
{% block title %}Nuevo Periodo — SIRH{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Nuevo Periodo de Nomina</h2>
    <a href="{% url 'periodo-list' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<div class="card" style="max-width: 560px;">
    <div class="card-body">
        <form method="post">{% csrf_token %}
            <div style="margin-bottom: 14px;"><label class="form-label">Nombre del Periodo <span class="text-danger">*</span></label>{{ form.nombre }}</div>
            <div style="display: flex; gap: 12px; margin-bottom: 14px;">
                <div style="flex: 1;"><label class="form-label">Fecha Inicio <span class="text-danger">*</span></label>{{ form.fecha_inicio }}</div>
                <div style="flex: 1;"><label class="form-label">Fecha Fin <span class="text-danger">*</span></label>{{ form.fecha_fin }}</div>
            </div>
            <div style="margin-bottom: 16px;"><label class="form-label">Parametros de Nomina <span class="text-danger">*</span></label>{{ form.parametros }}</div>
            <div style="display: flex; gap: 8px;">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Crear Periodo</button>
                <a href="{% url 'periodo-list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
